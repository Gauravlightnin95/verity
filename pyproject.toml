[project]
name = "verity"
version = "0.1.0"
description = "VERITY - Agentic AI news verification system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "langgraph>=0.2",
    "langchain-groq>=0.2",
    "ddgs>=6.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "trafilatura>=1.12",
    "streamlit>=1.38",
    "opencv-python>=4.10",
    "numpy>=1.26",
    "scipy>=1.14",
    "pillow>=10.4",
    "python-dotenv>=1.0",
    "rapidocr-onnxruntime>=1.3",
    "imagehash>=4.3",
    "scikit-image>=0.24",
    "openvino>=2024.4",
    "python-dateutil>=2.9",
    "langdetect>=1.0.9",
    "reportlab>=4.2",
    "python-json-logger>=2.0",
    "swytchcode-runtime>=1.1.5",
    # Not optional any more: agents/claim_extractor.py's check-worthiness
    # filter runs a local Hugging Face classifier on every extracted
    # sentence, so a plain `uv sync` has to provide it or every verify
    # fails at claim extraction. ~2-3GB, almost all of it torch.
    "transformers>=4.46",
    "torch>=2.5",
    "huggingface-hub>=0.26",
]

[project.optional-dependencies]
# Retained as a no-op so `uv sync --extra local-ai-text` from older docs
# still succeeds - the packages it used to carry are core dependencies now.
local-ai-text = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-mock>=3.14",
    "respx>=0.21",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "agents", "core", "forensics", "ml", "utils", "ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
